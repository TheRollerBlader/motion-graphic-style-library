[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionstyles"
version = "0.1.0"
description = "Python motion-graphic style libraries and agent skills for explainer videos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
preview = ["pillow>=10"]
dev = ["pillow>=10", "pytest>=8"]

[project.scripts]
motionstyles = "motionstyles.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
